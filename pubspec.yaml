name: marketplace
description: Marketplace de livraison multi-vendeurs — Mauritanie
publish_to: 'none'
version: 0.1.0

environment:
  # Relevé de 3.3.0 à 3.5.0 le 6 septembre 2026 : geolocator 14 exige au
  # moins Dart 3.5, et `flutter pub get` refuse une dépendance dont la
  # borne minimale est plus haute que celle du projet. Le Flutter installé
  # chez Emina est bien plus récent, donc rien à réinstaller.
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.5.6
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  # Position de livraison (6 septembre 2026) — voir
  # lib/services/location_service.dart. Pas d'API Google Maps : on demande
  # la position au téléphone, et la vendeuse l'ouvre ensuite dans Google
  # Maps par un simple lien (aucune clé, aucun compte de facturation).
 
  # Compression des photos avant envoi (9 septembre 2026) — voir
  # lib/services/image_compressor.dart. Bibliothèque en Dart pur : marche
  # aussi bien sur le web que sur Android, sans plugin natif.
  image: ^4.3.0
  image_picker: ^1.1.2
  # `google_fonts` retiré entièrement le 15 septembre 2026 — voir
  # core/theme.dart pour l'explication complète. Aucune version du paquet
  # n'est compatible avec Flutter 3.27.4 (Dart 3.13.1) : les versions
  # 6.x ont un bug de compilation ("Constant evaluation error" sur une
  # comparaison de FontWeight, corrigé seulement en 7.x/8.x), mais ces
  # versions corrigées exigent elles-mêmes Flutter 3.35+, plus récent que
  # celui utilisé ici. Polices système par défaut à la place.
  flutter_svg: ^2.0.10+1
  # **Abaissés le 22 septembre 2026 — le build Netlify échouait ICI.**
  #
  # `pdf` 3.13.1 et `printing` 5.15.1 exigent tous deux Dart >=3.12.0.
  # Or `netlify.toml` épingle Flutter 3.27.4, qui embarque Dart 3.6.2 :
  # `flutter pub get` n'avait donc AUCUNE solution possible et s'arrêtait
  # avant même `flutter build web`. `build/web` n'étant jamais créé,
  # Netlify n'avait rien à publier — d'où « published deploy: NONE ».
  #
  # Versions retenues : les plus récentes qui RÉSOLVENT réellement sous
  # Flutter 3.27.4, vérifié en lançant `flutter pub get` avec ce SDK
  # précis (~/flutter327) — et non en lisant les métadonnées pub.dev.
  #
  # La nuance compte : `pdf` 3.12.0 déclare `sdk: >=2.19.0 <4.0.0`, donc
  # semble parfaitement compatible avec Dart 3.6.2. Il dépend pourtant de
  # `vector_math ^2.2.0`, alors que le SDK Flutter 3.27 ÉPINGLE
  # `vector_math` à 2.1.4. Le conflit est donc transitif, invisible dans
  # la contrainte SDK du paquet lui-même : seule une vraie résolution le
  # montre. 3.11.3 est la dernière version d'avant ce passage à
  # `vector_math` 2.2.
  #
  # `printing` 5.14.3 demande `pdf ^3.10.0`, que 3.11.3 satisfait.
  pdf: ^3.11.3
  printing: ^5.14.3

dev_dependencies:
  # `flutter_test` retiré le 15 septembre 2026 : plus aucun test dans le
  # projet (celui par défaut, jamais adapté, a été supprimé), et il
  # entrait en conflit avec `objective_c` 9.6.0 sur la version du paquet
  # `collection` — voir le workaround `objective_c` plus bas dans ce
  # fichier. `flutter_test` verrouille `collection` à 1.19.0 pile, alors
  # qu'`objective_c` 9.6.0 exige `^1.19.1` : aucune version ne pouvait
  # satisfaire les deux à la fois.
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Correction du 15 septembre 2026, deuxième passe — la tentative précédente
# (forcer objective_c: 9.6.0 + collection: 1.19.1) faisait disparaître le
# conflit "collection" mais en révélait un autre derrière : objective_c
# 9.6.0 exige aussi `code_assets ^2.0.0`, qui lui-même exige Dart >=3.10 —
# alors que Flutter 3.27 (~/flutter327) embarque Dart 3.6.2.
#
# Racine du problème : rien dans ce projet n'importe `objective_c`
# directement. Il arrive uniquement via `path_provider_foundation`, dont
# les versions 2.5.0 et suivantes sont passées à une implémentation FFI qui
# en dépend. On force donc `path_provider_foundation` à une version
# d'AVANT ce passage à FFI : `objective_c` n'entre alors plus du tout dans
# le graphe de dépendances.
#
# **Corrigé le 22 septembre 2026 : 2.4.2 -> 2.4.1.** La version épinglée
# ici était 2.4.2, au motif — écrit noir sur blanc dans ce fichier — que
# son changelog annonçait « Flutter 3.27 / Dart 3.6 ». Les métadonnées
# RÉELLEMENT publiées de 2.4.2 disent l'inverse : `sdk: ^3.7.0`,
# `flutter: >=3.29.0`. Autrement dit, la contrainte ajoutée pour garder le
# projet compatible avec Flutter 3.27 était elle-même incompatible avec
# Flutter 3.27 — et, étant une version EXACTE dans `dependency_overrides`,
# pub ne pouvait pas la contourner : il devait prendre 2.4.2 ou échouer.
# C'était l'une des trois causes du build cassé.
#
# 2.4.1 déclare `sdk: ^3.3.0` / `flutter: >=3.19.0`, donc compatible avec
# Dart 3.6.2, et ne dépend que de `flutter` et
# `path_provider_platform_interface` — pas d'`objective_c`. La raison
# d'être de cet override tient donc toujours.
dependency_overrides:
  path_provider_foundation: 2.4.1
